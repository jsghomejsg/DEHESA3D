<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dehesa 3D - Impresión y Llaveros Personalizados</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    /* FONDO NEGRO PURO */
    body { background-color: #000000; color: #ffffff; padding: 20px; }
    
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding-bottom: 20px; 
      border-bottom: 1px solid #222222; 
      margin-bottom: 30px; 
    }
    .logo-text { font-size: 1.5rem; font-weight: bold; color: #ffffff; text-decoration: none; }
    
    .btn-download {
      background: #2563eb; 
      color: #ffffff; 
      border: none; 
      padding: 10px 18px; 
      border-radius: 8px; 
      font-weight: 600; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      gap: 8px;
    }
    .btn-download:hover { background: #1d4ed8; }

    .hero { text-align: center; margin-bottom: 40px; }
    .hero h1 { font-size: 2rem; margin-bottom: 8px; color: #ffffff; }
    .hero p { color: #a1a1aa; font-size: 1.1rem; }
    .hero-mockup { 
      width: 100%; 
      max-width: 450px; 
      border-radius: 16px; 
      margin-top: 20px; 
      border: 1px solid #222222;
      box-shadow: 0 12px 30px rgba(255, 255, 255, 0.05); 
    }

    .gallery-title { margin-bottom: 20px; font-size: 1.4rem; color: #e4e4e7; }
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); 
      gap: 20px; 
    }
    
    .card { 
      background: #111111; 
      border-radius: 12px; 
      overflow: hidden; 
      border: 1px solid #222222; 
    }
    .card img { width: 100%; height: 220px; object-fit: cover; display: block; }
    .card-content { padding: 16px; }
    .card-content h3 { font-size: 1.1rem; margin-bottom: 6px; color: #ffffff; }
    .card-content p { color: #a1a1aa; font-size: 0.9rem; line-height: 1.4; }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo-text">DEHESA 3D</a>
    <button class="btn-download" onclick="alert('Guardando app en tu dispositivo...')">
      📲 Descargar App
    </button>
  </header>

  <section class="hero">
    <h1>Impresión 3D y Llaveros Personalizados</h1>
    <p>Diseño y fabricación a medida con acabado profesional</p>
    <!-- Foto en la raíz del repositorio -->
    <img src="mockup-producto.png" alt="Catálogo Dehesa 3D" class="hero-mockup">
  </section>

  <h2 class="gallery-title">Catálogo de Productos</h2>

  <main class="grid">
    <!-- Foto dentro de la carpeta img/ -->
    <div class="card">
      <img src="img/silueta-opel.jpg" alt="Silueta Opel Impresa en 3D">
      <div class="card-content">
        <h3>Siluetas y Logos</h3>
        <p>Diseños personalizados en relieve para automoción y decoración.</p>
      </div>
    </div>
  </main>

</body>
</html>
