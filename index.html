<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dehesa 3D - Impresión y Llaveros Personalizados</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: #09090b; 
      color: #f4f4f5; 
      min-height: 100vh; 
      padding: 15px; 
      padding-bottom: 100px; 
    }
    
    .container { max-width: 1100px; margin: 0 auto; }

    /* CABECERA */
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 15px 0; 
      border-bottom: 1px solid #27272a; 
      margin-bottom: 30px; 
    }
    .logo { 
      font-size: 1.6rem; 
      font-weight: 800; 
      letter-spacing: -0.5px; 
      color: #ffffff; 
      text-decoration: none; 
    }
    
    .btn-download {
      background: #2563eb; 
      color: #ffffff; 
      border: none; 
      padding: 10px 18px; 
      border-radius: 20px; 
      font-weight: 600; 
      font-size: 0.9rem; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      gap: 6px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
      transition: transform 0.2s;
    }
    .btn-download:hover { transform: scale(1.04); background: #1d4ed8; }

    /* SECCIÓN PRINCIPAL */
    .hero { text-align: center; margin-bottom: 45px; }
    .hero h1 { font-size: 2.2rem; margin-bottom: 8px; font-weight: 800; color: #ffffff; }
    .hero p { color: #a1a1aa; font-size: 1.1rem; max-width: 600px; margin: 0 auto 20px auto; }
    .hero-img-container { display: flex; justify-content: center; }
    .hero-mockup { 
      width: 100%; 
      max-width: 480px; 
      max-height: 320px;
      object-fit: cover;
      border-radius: 16px; 
      border: 1px solid #27272a;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8); 
    }

    /* GALERÍA DE PRODUCTOS */
    .gallery-title { 
      font-size: 1.4rem; 
      margin-bottom: 20px; 
      font-weight: 700; 
      border-left: 4px solid #2563eb; 
      padding-left: 12px; 
    }
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
      gap: 24px; 
    }
    
    .card { 
      background: #18181b; 
      border-radius: 16px; 
      overflow: hidden; 
      border: 1px solid #27272a; 
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-4px); border-color: #3f3f46; }
    
    /* ENCUADRE PERFECTO DE IMÁGENES (EVITA QUE SE DEFORMEN) */
    .card-img-wrap {
      width: 100%;
      height: 240px;
      overflow: hidden;
      background: #000000;
    }
    .card img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      display: block; 
    }
    
    .card-content { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-content h3 { font-size: 1.15rem; margin-bottom: 6px; color: #ffffff; text-transform: capitalize; }
    .card-content p { color: #a1a1aa; font-size: 0.9rem; line-height: 1.4; margin-bottom: 16px; flex-grow: 1; }
    
    .btn-card-wa {
      background: #16a34a; 
      color: #ffffff; 
      text-decoration: none; 
      padding: 10px; 
      border-radius: 10px; 
      text-align: center; 
      font-weight: 600; 
      font-size: 0.9rem; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-card-wa:hover { background: #15803d; }

    /* BOTÓN FLOTANTE DE WHATSAPP */
    .whatsapp-float {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background-color: #25d366;
      color: #fff;
      width: 60px;
      height: 60px;
      border-radius: 50px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.2s;
    }
    .whatsapp-float:hover { transform: scale(1.1); }
    .whatsapp-float svg { width: 32px; height: 32px; fill: white; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <a href="#" class="logo">DEHESA 3D</a>
      <button class="btn-download" onclick="alert('Para instalar: usa la opción Añadir a pantalla de inicio en tu navegador.')">
        📲 Instalar App
      </button>
    </header>

    <section class="hero">
      <h1>Impresión 3D y Llaveros</h1>
      <p>Diseño y fabricación personalizada de alta calidad</p>
      <div class="hero-img-container">
        <img src="mockup-producto.png" alt="Catálogo Dehesa 3D" class="hero-mockup">
      </div>
    </section>

    <h2 class="gallery-title">Catálogo de Productos</h2>

    <main class="grid" id="gallery">
      <p style="color: #a1a1aa;">Cargando catálogo...</p>
    </main>
  </div>

  <!-- BOTÓN FLOTANTE WHATSAPP -->
  <a href="https://wa.me/34611801528?text=Hola%20Dehesa%203D,%20me%20gustaría%20consultar%20sobre%20un%20pedido" class="whatsapp-float" target="_blank" title="Contactar por WhatsApp">
    <svg viewBox="0 0 32 32">
      <path d="M16 2a14 14 0 0 0-11.8 21.5L2 30l6.7-2.1A14 14 0 1 0 16 2zm0 25.5a11.4 11.4 0 0 1-5.8-1.6l-.4-.2-4.3 1.3 1.4-4.2-.3-.5a11.5 11.5 0 1 1 9.4 5.2zm6.3-8.6c-.3-.2-2-.9-2.3-1s-.6-.2-.8.2-.9 1.1-1.1 1.3-.4.2-.7 0a9.2 9.2 0 0 1-2.7-1.7 10.2 10.2 0 0 1-1.9-2.3c-.2-.3 0-.5.1-.7l.5-.6c.1-.2.2-.4.3-.5.1-.2 0-.4 0-.5s-.8-2-1.1-2.7c-.3-.7-.6-.6-.8-.6h-.7c-.2 0-.8.1-1.2.5s-1.6 1.5-1.6 3.7 1.6 4.3 1.8 4.6c.2.3 3.2 4.9 7.8 6.9 1.1.5 2 .8 2.7 1 .1 0 2.1.8 3 .6a3.5 3.5 0 0 0 2.3-1.6c.3-.5.3-1 .2-1.1s-.5-.3-.8-.5z"/>
    </svg>
  </a>

  <script>
    const user = 'jsghomejsg';
    const repo = 'dehesa3d';
    const folder = 'img';
    const phone = '34611801528';

    async function autoLoadGallery() {
      const gallery = document.getElementById('gallery');
      try {
        const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${folder}`);
        const files = await response.json();
        
        const images = files.filter(f => /\.(jpg|jpeg|png|webp)$/i.test(f.name));
        
        if (images.length === 0) {
          gallery.innerHTML = '<p style="color: #a1a1aa;">Sube tus fotos a la carpeta img para verlas aquí.</p>';
          return;
        }

        gallery.innerHTML = '';

        images.forEach(file => {
          const cleanTitle = file.name
            .replace(/\.[^/.]+$/, "")
            .replace(/[-_]/g, " ");

          const waMessage = encodeURIComponent(`Hola Dehesa 3D, me interesa pedir información sobre: ${cleanTitle}`);

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-img-wrap">
              <img src="${file.path}" alt="${cleanTitle}" loading="lazy">
            </div>
            <div class="card-content">
              <h3>${cleanTitle}</h3>
              <p>Pieza personalizada fabricada con impresión 3D de alta precisión.</p>
              <a href="https://wa.me/${phone}?text=${waMessage}" target="_blank" class="btn-card-wa">
                💬 Pedir por WhatsApp
              </a>
            </div>
          `;
          gallery.appendChild(card);
        });
      } catch (err) {
        gallery.innerHTML = '<p style="color: #ef4444;">Error al cargar las imágenes.</p>';
      }
    }

    autoLoadGallery();
  </script>

</body>
</html>
