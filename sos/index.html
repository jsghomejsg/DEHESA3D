<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Emergencia SOS - Dehesa 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: #0f172a; 
      color: #f8fafc; 
      min-height: 100vh; 
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px; 
    }
    
    .card { 
      background: #1e293b; 
      border-radius: 20px; 
      max-width: 420px; 
      width: 100%;
      padding: 20px; 
      border: 2px solid #ef4444; 
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.25); 
      margin-top: 10px;
    }

    .header-tag {
      background: #ef4444;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 50px;
      display: inline-block;
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-transform: uppercase;
      text-align: center;
    }

    .child-name {
      font-size: 2.1rem;
      font-weight: 800;
      color: #ffffff;
      text-align: center;
      margin-bottom: 18px;
    }

    .btn-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }

    .btn-call {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #22c55e;
      color: #ffffff;
      text-decoration: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.25);
      transition: background 0.2s;
    }
    .btn-call:hover { background: #16a34a; }
    .btn-call.c2 { background: #0284c7; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25); }
    .btn-call.c2:hover { background: #0369a1; }
    .btn-call.c3 { background: #6366f1; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25); }
    .btn-call.c3:hover { background: #4f46e5; }
    .btn-call.c4 { background: #475569; box-shadow: 0 4px 12px rgba(71, 85, 105, 0.25); }
    .btn-call.c4:hover { background: #334155; }

    .info-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .info-box.alert { border-left: 4px solid #f59e0b; background: #1e1b18; }

    .info-title {
      color: #f59e0b;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .info-text { color: #e2e8f0; font-size: 0.95rem; line-height: 1.4; }
    .footer { font-size: 0.78rem; color: #64748b; text-align: center; margin-top: 15px; }
    .footer a { color: #94a3b8; text-decoration: none; }
    .loading { text-align: center; padding: 40px; color: #94a3b8; font-size: 1.1rem; }
  </style>
</head>
<body>

  <div class="card" id="app">
    <div class="loading">⏳ Cargando información de emergencia...</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = (urlParams.get('id') || 'P01').toUpperCase();

    // Conexión con tu Google Sheet mediante OpenSheet
    const sheetID = '1edWkhsyDjxSbNGrBzICfaVEpB2AoP3iIb35PtEjrFiI';

    async function fetchSheetData() {
      try {
        let res = await fetch(`https://opensheet.elk.sh/${sheetID}/1`);
        if (!res.ok) {
          res = await fetch(`https://opensheet.elk.sh/${sheetID}/Hoja1`);
        }
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    async function loadSOSCard() {
      const app = document.getElementById('app');
      const rows = await fetchSheetData();
      
      if (!rows) {
        app.innerHTML = `<div class="loading" style="color:#ef4444;">Error al conectar con los datos. Verifica el acceso público de la hoja.</div>`;
        return;
      }

      // Buscar la fila correspondiente al ID de la pulsera
      const data = rows.find(r => r.ID && r.ID.toString().trim().toUpperCase() === id);

      if (!data) {
        app.innerHTML = `<div class="loading" style="color:#ef4444;">⚠️ Pulsera no encontrada o inactiva (${id}).</div>`;
        return;
      }

      // Crear botones de teléfono dinámicamente si tienen datos
      let phonesHTML = '';
      if (data.Tel1) phonesHTML += `<a href="tel:${data.Tel1}" class="btn-call">📞 Llamar a ${data.Contacto1 || 'Contacto 1'}</a>`;
      if (data.Tel2) phonesHTML += `<a href="tel:${data.Tel2}" class="btn-call c2">📞 Llamar a ${data.Contacto2 || 'Contacto 2'}</a>`;
      if (data.Tel3) phonesHTML += `<a href="tel:${data.Tel3}" class="btn-call c3">📞 Llamar a ${data.Contacto3 || 'Contacto 3'}</a>`;
      if (data.Tel4) phonesHTML += `<a href="tel:${data.Tel4}" class="btn-call c4">📞 Llamar a ${data.Contacto4 || 'Contacto 4'}</a>`;

      app.innerHTML = `
        <div style="text-align: center;">
          <div class="header-tag">🚨 Ficha de Emergencia SOS</div>
        </div>

        <div class="child-name">${data.Nombre || 'Nombre no asignado'}</div>

        <div class="btn-grid">
          ${phonesHTML}
        </div>

        ${data.Alergias ? `
          <div class="info-box alert">
            <div class="info-title">⚠️ Información Médica / Alergias</div>
            <div class="info-text">${data.Alergias}</div>
          </div>
        ` : ''}

        ${data.Direccion ? `
          <div class="info-box">
            <div class="info-title" style="color: #38bdf8;">🏠 Dirección / Notas</div>
            <div class="info-text">${data.Direccion}</div>
          </div>
        ` : ''}

        <div class="footer">
          Pulsera NFC de Seguridad • <a href="https://jsghomejsg.github.io/dehesa3d/" target="_blank">Dehesa 3D</a>
        </div>
      `;
    }

    loadSOSCard();
  </script>

</body>
</html>
