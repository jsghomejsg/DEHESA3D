<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Emergencia SOS - Dehesa 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: #0f172a; 
      color: #f8fafc; 
      min-height: 100vh; 
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px; 
    }
    
    .card { 
      background: #1e293b; 
      border-radius: 20px; 
      max-width: 420px; 
      width: 100%;
      padding: 20px; 
      border: 2px solid #ef4444; 
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.25); 
      margin-top: 10px;
    }

    .header-tag {
      background: #ef4444;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 50px;
      display: inline-block;
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-transform: uppercase;
      text-align: center;
    }

    .child-name {
      font-size: 2.1rem;
      font-weight: 800;
      color: #ffffff;
      text-align: center;
      margin-bottom: 18px;
    }

    .btn-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }

    .btn-call {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #22c55e;
      color: #ffffff;
      text-decoration: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.25);
      transition: background 0.2s;
    }
    .btn-call:hover { background: #16a34a; }
    .btn-call.c2 { background: #0284c7; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25); }
    .btn-call.c2:hover { background: #0369a1; }
    .btn-call.c3 { background: #6366f1; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25); }
    .btn-call.c3:hover { background: #4f46e5; }
    .btn-call.c4 { background: #475569; box-shadow: 0 4px 12px rgba(71, 85, 105, 0.25); }
    .btn-call.c4:hover { background: #334155; }

    .info-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .info-box.alert { border-left: 4px solid #f59e0b; background: #1e1b18; }

    .info-title {
      color: #f59e0b;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .info-text { color: #e2e8f0; font-size: 0.95rem; line-height: 1.4; }
    .footer { font-size: 0.78rem; color: #64748b; text-align: center; margin-top: 15px; }
    .footer a { color: #94a3b8; text-decoration: none; }
    .loading { text-align: center; padding: 40px; color: #94a3b8; font-size: 1.1rem; line-height: 1.5; }
  </style>
</head>
<body>

  <div class="card" id="app">
    <div class="loading">⏳ Cargando información de emergencia...</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = (urlParams.get('id') || 'P01').toUpperCase();

    const sheetID = '1edWkhsyDjxSbNGrBzICfaVEpB2AoP3iIb35PtEjrFiI';

    async function fetchSheetData() {
      // Intenta conectar con la pestaña exacta 'Pulseras SOS' o alternativas
      const tabs = ['Pulseras SOS', 'Hoja 1', 'Hoja1', '1'];
      for (let tab of tabs) {
        try {
          let res = await fetch(`https://opensheet.elk.sh/${sheetID}/${encodeURIComponent(tab)}`);
          if (res.ok) {
            let data = await res.json();
            if (Array.isArray(data) && data.length > 0) return data;
          }
        } catch (e) {}
      }
      return null;
    }

    async function loadSOSCard() {
      const app = document.getElementById('app');
      try {
        const rows = await fetchSheetData();
        
        if (!rows) {
          app.innerHTML = `
            <div class="loading" style="color:#ef4444;">
              ⚠️ No se pudo conectar con la base de datos.<br><br>
              <small style="color:#94a3b8; font-size:0.85rem;">
                Comprueba que en Google Sheets la hoja esté como pública ("Cualquier persona con el enlace").
              </small>
            </div>`;
          return;
        }

        const data = rows.find(r => r.ID && r.ID.toString().trim().toUpperCase() === id);

        if (!data) {
          app.innerHTML = `<div class="loading" style="color:#ef4444;">⚠️ Pulsera no encontrada o inactiva (${id}).</div>`;
          return;
        }

        let phonesHTML = '';
        if (data.Tel1) phonesHTML += `<a href="tel:${data.Tel1}" class="btn-call">📞 Llamar a ${data.Contacto1 || 'Contacto 1'}</a>`;
        if (data.Tel2) phonesHTML += `<a href="tel:${data.Tel2}" class="btn-call c2">📞 Llamar a ${data.Contacto2 || 'Contacto 2'}</a>`;
        if (data.Tel3) phonesHTML += `<a href="tel:${data.Tel3}" class="btn-call c3">📞 Llamar a ${data.Contacto3 || 'Contacto 3'}</a>`;
        if (data.Tel4) phonesHTML += `<a href="tel:${data.Tel4}" class="btn-call c4">📞 Llamar a ${data.Contacto4 || 'Contacto 4'}</a>`;

        app.innerHTML = `
          <div style="text-align: center;">
            <div class="header-tag">🚨 Ficha de Emergencia SOS</div>
          </div>

          <div class="child-name">${data.Nombre || 'Nombre no asignado'}</div>

          <div class="btn-grid">
            ${phonesHTML}
          </div>

          ${data.Alergias ? `
            <div class="info-box alert">
              <div class="info-title">⚠️ Información Médica / Alergias</div>
              <div class="info-text">${data.Alergias}</div>
            </div>
          ` : ''}

          ${data.Notas ? `
            <div class="info-box">
              <div class="info-title" style="color: #38bdf8;">📌 Información Adicional / Notas</div>
              <div class="info-text">${data.Notas}</div>
            </div>
          ` : ''}

          <div class="footer">
            Pulsera NFC de Seguridad • <a href="https://jsghomejsg.github.io/dehesa3d/" target="_blank">Dehesa 3D</a>
          </div>
        `;
      } catch (err) {
        app.innerHTML = `<div class="loading" style="color:#ef4444;">Error al cargar la ficha.</div>`;
      }
    }

    loadSOSCard();
  </script>

</body>
</html>
